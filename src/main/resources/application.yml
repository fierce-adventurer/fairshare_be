spring:
  application:
    name: fairshare-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fairshare}
    username: ${DATABASE_USERNAME:fairshare}
    password: ${DATABASE_PASSWORD:fairshare_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 60000
      max-lifetime: 300000
      keepalive-time: 30000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:900}        # 15 minutes in seconds
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:2592000}   # 30 days in seconds
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/google/callback}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/github/callback}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}
      client-secret: ${APPLE_CLIENT_SECRET:}
      redirect-uri: ${APPLE_REDIRECT_URI:https://example.com/api/v1/auth/oauth/apple/callback}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  native-auth-redirect-url: ${NATIVE_AUTH_REDIRECT_URL:com.fairshare.app://auth/callback}
  mobile-redirect-uri: ${MOBILE_REDIRECT_URI:${NATIVE_AUTH_REDIRECT_URL:com.fairshare.app://auth/callback}}
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://localhost,capacitor://localhost,http://localhost}
  auth:
    otp:
      expose-dev-code: ${OTP_EXPOSE_DEV_CODE:false}
      ttl-seconds: ${OTP_TTL_SECONDS:300}
      resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}
      pepper: ${OTP_PEPPER:${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
  sms:
    provider: ${SMS_PROVIDER:console}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  email:
    delivery-enabled: ${EMAIL_DELIVERY_ENABLED:false}
    expose-dev-link: ${EMAIL_EXPOSE_DEV_LINK:false}
    from: ${EMAIL_FROM:no-reply@fairshare.app}
  whatsapp:
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    graph-version: ${WHATSAPP_GRAPH_VERSION:v21.0}
  instagram:
    access-token: ${INSTAGRAM_ACCESS_TOKEN:}
    account-id: ${INSTAGRAM_ACCOUNT_ID:}
    graph-version: ${INSTAGRAM_GRAPH_VERSION:v25.0}

management:
  health:
    mail:
      enabled: ${EMAIL_DELIVERY_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.fairshare: INFO
    org.springframework.security: WARN
